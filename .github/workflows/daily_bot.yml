name: School Schedule Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим запуска (schedule или homework)'
        required: true
        default: 'schedule'
        type: choice
        options:
          - schedule
          - homework

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка библиотек
        run: pip install -r requirements.txt || pip install requests pytz

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'schedule' }}"
          echo "Запуск в режиме: $MODE"
          python bot.py "$
          MODE"
