name: School Schedule Bot

on:
  schedule:
    # 12:12 UTC = 15:12 МСК/Минск (Вс, Пн, Вт, Ср, Чт)
    - cron: '12 12 * * 0,1,2,3,4'
    # 17:02 UTC = 20:02 МСК/Минск (Пн, Вт, Ср, Чт)
    - cron: '2 17 * * 1,2,3,4'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install requests pytz

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "Причина запуска: ${{ github.event_name }} (${{ github.event.schedule }})"
          if [ "${{ github.event.schedule }}" = "2 17 * * 1,2,3,4" ]; then
            python bot.py homework
          else
            python bot.py schedule
       
          fi
